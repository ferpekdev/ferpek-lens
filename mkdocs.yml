site_name: Lens
site_description: Open-source log analysis for system administrators.
site_url: https://docs.ferpek.com/

repo_name: ferpekdev/ferpek-lens
repo_url: https://github.com/ferpekdev/ferpek-lens

theme:
  name: material
  logo: assets/ferpek-logo-white.png
  favicon: assets/ferpek-logo.svg
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: custom
      accent: custom
      media: "(prefers-color-scheme: light)"
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      media: "(prefers-color-scheme: dark)"
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md

  - Getting started:
      - Installation: getting-started/installation.md
      - Add your first host: getting-started/first-host.md

  - Agents:
      - Overview: agents/overview.md

  - Packs:
      - Overview: packs/overview.md
      - Pack development: packs/development.md

  - Troubleshooting:
      - Overview: troubleshooting/index.md

extra_css:
  - stylesheets/ferpek.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ferpekdev/ferpek-lens
    - icon: fontawesome/solid/globe
      link: https://ferpek.com/products/lens/

copyright: FERPEK Lens
