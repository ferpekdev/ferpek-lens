id: openssh.repeated_failed_password

name: Repeated SSH authentication failures

source_family: authentication

match:
  regex: 'Failed password for (?:invalid user )?(?P<user>\S+) from (?P<ip>[0-9a-fA-F:.]+)'

group_by:
  - ip

aggregate:
  window_seconds: 300
  threshold: 5
  cooldown_seconds: 900

finding:
  severity: warn
  title: Repeated SSH authentication failures
  detail: "{count} failed SSH password attempts from {ip} during the last 5 minutes."

fields:
  source_ip: "{ip}"
  username: "{user}"
