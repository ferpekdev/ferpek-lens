id: openssh
name: OpenSSH
version: 0.2.0
author: FERPEK
description: Detection and interpretation of OpenSSH authentication events.

compatibility:
  server: ">=0.3.0"
  agent: ">=0.5.0"

sources:
  - authentication
  - auth-file

platforms:
  linux:
    sources:
      - id: authentication
        discovery:
          - type: journal
            units:
              - ssh.service
              - sshd.service

          - type: file
            paths:
              - /var/log/auth.log
              - /var/log/secure

        manual:
          fields:
            - id: log_path
              label: Log file
              type: path
              required: true

origin: official

category:
  id: security
  label: Security
