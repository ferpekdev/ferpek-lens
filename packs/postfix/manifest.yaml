id: postfix
name: Postfix
version: 0.2.0
author: FERPEK
description: Interpretation of Postfix mail transport logs.

compatibility:
  server: ">=0.3.0"
  agent: ">=0.5.0"

sources:
  - mail-file

platforms:
  linux:
    sources:
      - id: mail-file
        family: postfix
        discovery:
          - type: file
            paths:
              - /var/log/mail.log
              - /var/log/maillog

          - type: journal
            units:
              - postfix.service

        manual:
          fields:
            - id: log_path
              label: Postfix mail log
              type: path
              required: true

origin: official

category:
  id: mail
  label: Mail
