id: nginx
name: Nginx
version: 0.3.0
author: FERPEK
description: Detection and interpretation of Nginx HTTP access events.

origin: official

category:
  id: web
  label: Web

compatibility:
  server: ">=0.3.0"
  agent: ">=0.5.0"

sources:
  - nginx-access
  - web-access

platforms:
  linux:
    sources:
      - id: nginx-access
        family: web-access
        discovery:
          - type: file
            paths:
              - /var/log/nginx/access.log
        manual:
          fields:
            - id: log_path
              label: Access log
              type: path
              required: true
