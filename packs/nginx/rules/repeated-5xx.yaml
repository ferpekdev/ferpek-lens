id: nginx.repeated_5xx

name: Repeated HTTP server errors

source_family: web-access

match:
  regex: '^(?P<ip>[0-9a-fA-F:.]+) .* "(?P<method>[A-Z]+) (?P<path>\S+) HTTP/[0-9.]+" (?P<status>5[0-9]{2}) '

group_by:
  - status

relevant:
  severity: error
  title: HTTP server error
  detail: "{method} {path} returned HTTP {status}."

aggregate:
  window_seconds: 300
  threshold: 10
  cooldown_seconds: 900

finding:
  severity: warn
  title: Repeated HTTP server errors
  detail: "{count} HTTP {status} responses were returned during the last 5 minutes."

fields:
  source_ip: "{ip}"
  method: "{method}"
  path: "{path}"
  status: "{status}"
