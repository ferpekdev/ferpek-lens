id: fail2ban
name: Fail2ban
version: 0.2.1
author: FERPEK
description: Interpretation of Fail2ban bans, unbans and repeated hostile activity.

compatibility:
  server: ">=0.3.0"
  agent: ">=0.5.0"

sources:
  - fail2ban

platforms:
  linux:
    sources:
      - id: fail2ban
        family: fail2ban
        discovery:
          - type: file
            paths:
              - /var/log/fail2ban.log

          - type: journal
            units:
              - fail2ban.service

        manual:
          fields:
            - id: log_path
              label: Fail2ban log
              type: path
              required: true

origin: official

category:
  id: security
  label: Security
