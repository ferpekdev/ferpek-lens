name: ferpek

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    ports:
      - "${FERPEK_PORT:-8000}:8000"
    environment:
      - DB_PATH=/data/ferpek.db
      - PACK_REGISTRY_URL=${PACK_REGISTRY_URL:-https://raw.githubusercontent.com/ferpekdev/ferpek-lens-packs/main/index.json}
    volumes:
      - server_data:/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  web:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      server:
        condition: service_healthy

volumes:
  server_data:
