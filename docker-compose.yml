name: ferpek

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DB_PATH=/data/ferpek.db
      - LDAP_CA_CERT=/etc/ferpek/certs/ad-ca.pem
    volumes:
      - server_data:/data
      - ./certs/ad-ca.pem:/etc/ferpek/certs/ad-ca.pem:ro
    extra_hosts:
      - "example.internal:127.0.0.1"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  server_data:
