name: ferpek-lens

services:
  server:
    image: ghcr.io/ferpekdev/ferpek-lens-server:${FERPEK_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${FERPEK_PORT:-8000}:8000"
    environment:
      - DB_PATH=/data/ferpek.db
      - PACK_REGISTRY_URL=${PACK_REGISTRY_URL:-https://raw.githubusercontent.com/ferpekdev/ferpek-lens-packs/main/index.json}
    volumes:
      - server_data:/data
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

  web:
    image: ghcr.io/ferpekdev/ferpek-lens-web:${FERPEK_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${FERPEK_WEB_PORT:-5173}:80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1/
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  server_data:
